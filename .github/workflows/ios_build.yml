name: Flutter iOS Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: 

jobs:
  build:
    # UPDATED: Use macos-15 (Osprey) for 2026 stability and Xcode 16/17 support
    runs-on: macos-15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get
          cd ios
          # DEEP CLEAN: Ensures no old FFmpeg versions are cached in the cloud
          rm -rf Pods
          rm -rf Podfile.lock
          rm -rf .symlinks
          pod repo update
          # Use --repo-update to find the new FFmpegKit links
          pod install --repo-update
          cd ..

      - name: Build iOS IPA
        # This builds the 'Runner.app' which is enough for a "Success" check
        run: flutter build ios --release --no-codesign 

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-debug
          path: build/ios/iphoneos/Runner.app
          retention-days: 3